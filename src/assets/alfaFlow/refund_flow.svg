<rect width="2440" height="458" fill="#FFFFFF"/>
<text x="40" y="42" font-size="17" font-weight="600" fill="#17181C">Ticket refund flow</text>
<rect x="40" y="190" width="200" height="84" rx="12" fill="#F4F5F7" stroke="#E4E6EA" stroke-width="1.5"/><text x="140.0" y="224" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181C">Personal account</text><text x="140.0" y="247" text-anchor="middle" font-size="12.5" fill="#8B8F98">Select a ticket</text><rect x="310" y="190" width="200" height="84" rx="12" fill="#F4F5F7" stroke="#E4E6EA" stroke-width="1.5"/><text x="410.0" y="224" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181C">Start a refund</text><text x="410.0" y="247" text-anchor="middle" font-size="12.5" fill="#8B8F98">Refund request</text><rect x="580" y="78" width="200" height="84" rx="12" fill="#F4F5F7" stroke="#E4E6EA" stroke-width="1.5"/><text x="680.0" y="112" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181C">Voluntary</text><text x="680.0" y="135" text-anchor="middle" font-size="12.5" fill="#8B8F98">Change of plans</text><rect x="580" y="302" width="200" height="84" rx="12" fill="#F4F5F7" stroke="#E4E6EA" stroke-width="1.5"/><text x="680.0" y="336" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181C">Involuntary</text><text x="680.0" y="359" text-anchor="middle" font-size="12.5" fill="#8B8F98">Illness, cancelled flight</text><rect x="850" y="190" width="200" height="84" rx="12" fill="#F4F5F7" stroke="#E4E6EA" stroke-width="1.5"/><text x="950.0" y="224" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181C">Select a reason</text><text x="950.0" y="247" text-anchor="middle" font-size="12.5" fill="#8B8F98">Refund cause</text><rect x="1120" y="190" width="200" height="84" rx="12" fill="#F4F5F7" stroke="#E4E6EA" stroke-width="1.5"/><text x="1220.0" y="224" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181C">Select passengers</text><text x="1220.0" y="247" text-anchor="middle" font-size="12.5" fill="#8B8F98">Whole booking or part</text><rect x="1390" y="190" width="200" height="84" rx="12" fill="#F4F5F7" stroke="#E4E6EA" stroke-width="1.5"/><text x="1490.0" y="224" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181C">Upload documents</text><text x="1490.0" y="247" text-anchor="middle" font-size="12.5" fill="#8B8F98">Proof for involuntary</text><rect x="1660" y="190" width="200" height="84" rx="12" fill="#F4F5F7" stroke="#E4E6EA" stroke-width="1.5"/><text x="1760.0" y="224" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181C">We ask the airline</text><text x="1760.0" y="247" text-anchor="middle" font-size="12.5" fill="#8B8F98">Request sent, status tracked</text><rect x="1930" y="190" width="200" height="84" rx="12" fill="#F4F5F7" stroke="#E4E6EA" stroke-width="1.5"/><text x="2030.0" y="224" text-anchor="middle" font-size="14.5" font-weight="600" fill="#17181C">Approved</text><text x="2030.0" y="247" text-anchor="middle" font-size="12.5" fill="#8B8F98">Quote sent, timer running</text><rect x="2200" y="190" width="200" height="84" rx="12" fill="#EAF7EF" stroke="#2E9E5B" stroke-width="1.5"/><text x="2300.0" y="224" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1C7A44">Money returned</text><text x="2300.0" y="247" text-anchor="middle" font-size="12.5" fill="#8B8F98">Refund to the card</text><rect x="1660" y="330" width="200" height="84" rx="12" fill="#FDEEEE" stroke="#E5484D" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1760.0" y="364" text-anchor="middle" font-size="14.5" font-weight="600" fill="#B3383C">Airline refused</text><text x="1760.0" y="387" text-anchor="middle" font-size="12.5" fill="#8B8F98">Dead end, we explain why</text><rect x="1930" y="330" width="200" height="84" rx="12" fill="#FDEEEE" stroke="#E5484D" stroke-width="1.5" stroke-dasharray="6 5"/><text x="2030.0" y="364" text-anchor="middle" font-size="14.5" font-weight="600" fill="#B3383C">Customer declined</text><text x="2030.0" y="387" text-anchor="middle" font-size="12.5" fill="#8B8F98">Dead end, request closed</text><line x1="240" y1="232.0" x2="299" y2="232.0" stroke="#B4B8C0" stroke-width="2" marker-end="url(#ar)"/><path d="M510 232.0 H545.0 V120.0 H569" fill="none" stroke="#B4B8C0" stroke-width="2" marker-end="url(#ar)"/><path d="M510 232.0 H545.0 V344.0 H569" fill="none" stroke="#B4B8C0" stroke-width="2" marker-end="url(#ar)"/><path d="M780 120.0 H815.0 V232.0 H839" fill="none" stroke="#B4B8C0" stroke-width="2" marker-end="url(#ar)"/><path d="M780 344.0 H815.0 V232.0 H839" fill="none" stroke="#B4B8C0" stroke-width="2" marker-end="url(#ar)"/><line x1="1050" y1="232.0" x2="1109" y2="232.0" stroke="#B4B8C0" stroke-width="2" marker-end="url(#ar)"/><line x1="1320" y1="232.0" x2="1379" y2="232.0" stroke="#B4B8C0" stroke-width="2" marker-end="url(#ar)"/><line x1="1590" y1="232.0" x2="1649" y2="232.0" stroke="#B4B8C0" stroke-width="2" marker-end="url(#ar)"/><line x1="1860" y1="232.0" x2="1919" y2="232.0" stroke="#B4B8C0" stroke-width="2" marker-end="url(#ar)"/><text x="1895.0" y="223.0" text-anchor="middle" font-size="12" fill="#8B8F98">agrees</text><line x1="2130" y1="232.0" x2="2189" y2="232.0" stroke="#B4B8C0" stroke-width="2" marker-end="url(#ar)"/><text x="2165.0" y="223.0" text-anchor="middle" font-size="12" fill="#8B8F98">confirms</text><path d="M1760.0 274 V319" fill="none" stroke="#E5484D" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-err)"/><text x="1769.0" y="300" font-size="12" fill="#E5484D">refuses</text><path d="M2030.0 274 V319" fill="none" stroke="#E5484D" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar-err)"/><text x="2039.0" y="300" font-size="12" fill="#E5484D">declines or timer runs out</text>
</svg>